name: Update live stats

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: write
  pages: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LeetCode + GitHub numbers
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: update live stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made with GITHUB_TOKEN don't trigger the Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; it will publish on the next push."
